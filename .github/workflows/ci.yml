name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==9.1.1 ruff==0.15.20
      - name: Run tests
        run: python -m pytest -q 2>&1 | tee pytest.log
      - name: Report test failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("pytest.log").read_text()[-5000:]
          escaped = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest failure::{escaped}")
          PY
      - run: ruff check server scripts tests
      - run: ./scripts/check-release.sh
      - run: ./release/build-release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: dist/

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck install.sh scripts/*.sh scripts/lemur release/build-release.sh
