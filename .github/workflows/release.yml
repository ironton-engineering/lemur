name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==9.1.1 ruff==0.15.20
      - run: python -m pytest -q
      - run: ruff check server scripts tests
      - run: ./scripts/check-release.sh
      - run: ./release/build-release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: release
          path: dist
      - name: Publish pre-release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          gh release view "$version" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$version" --prerelease --generate-notes --repo "${{ github.repository }}"
          gh release upload "$version" dist/* --clobber --repo "${{ github.repository }}"
