name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==9.1.1 ruff==0.15.20
      - run: python -m pytest -q
      - run: ruff check server scripts tests
      - run: ./scripts/check-release.sh
      - run: ./release/build-release.sh
      - name: Check tag and application version
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/install.sh
            dist/lemur-linux-x86_64.tar.gz
            dist/lemur-linux-x86_64.tar.gz.sha256
            dist/manifest.json
            dist/LICENSE
