name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q
      - run: ./release/build-release.sh
      - name: Publish pre-release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          gh release view "$version" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$version" --prerelease --generate-notes --repo "${{ github.repository }}"
          gh release upload "$version" dist/* --clobber --repo "${{ github.repository }}"
